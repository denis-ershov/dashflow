name: CI Quality Gate

on:
  push:
    branches: [main, refactor/*, feature/*, fix/*]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Минимальные права токена: CI только читает код и загружает артефакты
permissions:
  contents: read

jobs:
  audit-and-build:
    name: Typecheck, Lint, Test, Build & E2E
    runs-on: ubuntu-latest

    steps:
      # Actions закреплены по SHA коммита (в комментарии — версия), Dependabot обновляет их
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Блокирует только уязвимости в коде, который попадает в расширение
      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript Typecheck
        run: npm run compile

      - name: ESLint Code Quality
        run: npm run lint

      - name: Prettier Format Check
        run: npm run format:check

      - name: Unit & Component Tests with Coverage Thresholds
        run: npm run test:coverage

      - name: WXT Chrome MV3 & Firefox Gecko Production Build
        run: npm run build:all

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E Smoke on Built Extension
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Upload E2E Traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: WXT Package Bundling
        run: npm run zip:all

      - name: Upload Chrome Extension Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashflow-chrome-mv3
          path: .output/chrome-mv3/
          retention-days: 7

      - name: Upload Firefox Extension Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashflow-firefox-mv2
          path: .output/firefox-mv2/
          retention-days: 7

      - name: Upload Release Zips
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashflow-store-packages
          path: .output/*.zip
          retention-days: 14
