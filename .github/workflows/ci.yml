name: CI Quality Gate

on:
  push:
    branches: [ main, refactor/*, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-build:
    name: Typecheck, Lint, Test & Cross-Browser Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run compile

      - name: ESLint Code Quality
        run: npm run lint

      - name: Unit & Component Tests
        run: npm test

      - name: WXT Chrome MV3 & Firefox Gecko Production Build
        run: npm run build:all

      - name: WXT Package Bundling
        run: npm run zip:all

      - name: Upload Chrome Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashflow-chrome-mv3
          path: .output/chrome-mv3/
          retention-days: 7

      - name: Upload Firefox Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashflow-firefox-mv2
          path: .output/firefox-mv2/
          retention-days: 7

      - name: Upload Release Zips
        uses: actions/upload-artifact@v4
        with:
          name: dashflow-store-packages
          path: .output/*.zip
          retention-days: 14
