name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run compile

      - name: ESLint Code Quality
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Build Chrome and Firefox Extensions
        run: npm run build:all

      - name: Package Extension Archives
        run: npm run zip:all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DashFlow ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            .output/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
